name: 投資生態圈每週檢查
on:
  schedule:
    - cron: "17 0 * * 1"   # 每週一 08:17（台北）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 更新上市持股現值與各家市值（依最新收盤價）
        run: python update_prices.py .
      - name: 檢查新動態並重建 Dashboard（未設定 ANTHROPIC_API_KEY 時略過檢查）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python check_updates.py .
      - name: 重建跨實體總網路圖並做一致性檢查
        run: python build_network.py network_template.html docs/Ecosystem_Network_Map.html "data/*/data.json"
      - name: 測試全部頁面（有錯誤就不提交）
        run: |
          pip install -q playwright && playwright install --with-deps chromium >/dev/null
          python test_all.py docs
      - name: 提交變更
        run: |
          git config user.name "ecomap-bot"
          git config user.email "ecomap-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "沒有變更"; else
            git commit -m "chore: weekly check $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
